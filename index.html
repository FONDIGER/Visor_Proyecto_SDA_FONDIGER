        <div id="map">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/L.Control.Locate.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="js/leaflet-measure.js"></script>
        <script src="js/leaflet.markercluster.js"></script>
        <script src="js/leaflet-search.js"></script>
        <script src="data/Riesgovolcamientoycadaderamas_2.js"></script>
        <script src="data/Parquespriorizados_3.js"></script>
        <script src="data/Redvialpriorizada_4.js"></script>
        <script src="data/rbolesautorizadospreventiva_6.js"></script>
        <script src="data/Lmiteurbano_7.js"></script>
        <!-- Librería para soporte de PMTiles -->
        <script src="https://unpkg.com/pmtiles@2.10.0/dist/index.js"></script>
        <script src="https://unpkg.com/protomaps-leaflet@v3.1.0/dist/protomaps-leaflet.js"></script>
        
        <script>
        var map = L.map('map', {
            zoomControl:false, maxZoom:19, minZoom:10
        }).fitBounds([[4.459562594150919,-74.365277374599],[4.83971214808472,-73.87036569117575]]);

        var capaPMTiles = protomapsL.leafletLayer({
            url: 'data/neatogeo_Capas_optimizadas.pmtiles'
        }).addTo(map);

        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        
        function removeEmptyRowsFromPopupContent(content, feature) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var rows = tempDiv.querySelectorAll('tr');
            for (var i = 0; i < rows.length; i++) {
                var td = rows[i].querySelector('td.visible-with-data');
                var key = td ? td.id : '';
                if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                    rows[i].parentNode.removeChild(rows[i]);
                }
            }
            return tempDiv.innerHTML;
        }

        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.update();
                    }, 10);
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        
        L.control.locate({locateOptions: {maxZoom: 19}}).addTo(map);
        
        var measureControl = new L.Control.Measure({
            position: 'topleft',
            primaryLengthUnit: 'meters',
            secondaryLengthUnit: 'kilometers',
            primaryAreaUnit: 'sqmeters',
            secondaryAreaUnit: 'hectares'
        });
        measureControl.addTo(map);
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].innerHTML = '';
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].className += ' fas fa-ruler';
        
        var bounds_group = new L.featureGroup([]);
        function setBounds() {}

        map.createPane('pane_OpenStreetMap_0');
        map.getPane('pane_OpenStreetMap_0').style.zIndex = 400;
        var layer_OpenStreetMap_0 = L.tileLayer('http://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            pane: 'pane_OpenStreetMap_0',
            opacity: 1.0,
            attribution: '<a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors, CC-BY-SA</a>',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 19
        });

        map.createPane('pane_Imagensatelital_1');
        map.getPane('pane_Imagensatelital_1').style.zIndex = 401;
        var layer_Imagensatelital_1 = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            pane: 'pane_Imagensatelital_1',
            opacity: 1.0,
            attribution: '<a href="https://www.google.at/permissions/geoguidelines/attr-guide.html">Map data ©2015 Google</a>',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 20
        });
        map.addLayer(layer_Imagensatelital_1);

        // Capa Riesgo Volcamiento
        function pop_Riesgovolcamientoycadaderamas_2(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">CATRIES_UN</th>\
                        <td>' + (feature.properties['CATRIES_UN'] !== null ? autolinker.link(String(feature.properties['CATRIES_UN']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
            layer.on('popupopen', function(e) {
                addClassToPopupIfMedia(content, e.popup);
            });
            layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_Riesgovolcamientoycadaderamas_2_0(feature) {
            switch(String(feature.properties['CATRIES_UN'])) {
                case 'Muy alto': return { pane: 'pane_Riesgovolcamientoycadaderamas_2', opacity: 1, color: 'rgba(35,35,35,0.0)', weight: 1.0, fill: true, fillOpacity: 1, fillColor: 'rgba(227,26,28,1.0)', interactive: true };
                case 'Alto': return { pane: 'pane_Riesgovolcamientoycadaderamas_2', opacity: 1, color: 'rgba(35,35,35,0.0)', weight: 1.0, fill: true, fillOpacity: 1, fillColor: 'rgba(255,127,0,1.0)', interactive: true };
                case 'Medio': return { pane: 'pane_Riesgovolcamientoycadaderamas_2', opacity: 1, color: 'rgba(35,35,35,0.0)', weight: 1.0, fill: true, fillOpacity: 1, fillColor: 'rgba(239,237,94,1.0)', interactive: true };
                case 'Bajo': return { pane: 'pane_Riesgovolcamientoycadaderamas_2', opacity: 1, color: 'rgba(35,35,35,0.0)', weight: 1.0, fill: true, fillOpacity: 1, fillColor: 'rgba(178,223,138,1.0)', interactive: true };
                case 'Muy bajo': return { pane: 'pane_Riesgovolcamientoycadaderamas_2', opacity: 1, color: 'rgba(35,35,35,0.0)', weight: 1.0, fill: true, fillOpacity: 1, fillColor: 'rgba(51,160,44,1.0)', interactive: true };
                default: return { pane: 'pane_Riesgovolcamientoycadaderamas_2', opacity: 1, color: 'rgba(35,35,35,0.0)', weight: 1.0, fill: true, fillOpacity: 1, fillColor: 'rgba(127,206,23,1.0)', interactive: true };
            }
        }

        map.createPane('pane_Riesgovolcamientoycadaderamas_2');
        map.getPane('pane_Riesgovolcamientoycadaderamas_2').style.zIndex = 402;
        var layer_Riesgovolcamientoycadaderamas_2 = new L.geoJson(json_Riesgovolcamientoycadaderamas_2, {
            attribution: '',
            interactive: true,
            dataVar: 'json_Riesgovolcamientoycadaderamas_2',
            layerName: 'layer_Riesgovolcamientoycadaderamas_2',
            pane: 'pane_Riesgovolcamientoycadaderamas_2',
            onEachFeature: pop_Riesgovolcamientoycadaderamas_2,
            style: style_Riesgovolcamientoycadaderamas_2_0,
        });
        bounds_group.addLayer(layer_Riesgovolcamientoycadaderamas_2);
        map.addLayer(layer_Riesgovolcamientoycadaderamas_2);

        // Capa Parques Priorizados
        function pop_Parquespriorizados_3(feature, layer) {
            var popupContent = '<table>\
                    <tr><th scope="row">CODIGO_ID</th><td>' + (feature.properties['CODIGO_ID'] !== null ? autolinker.link(String(feature.properties['CODIGO_ID'])) : '') + '</td></tr>\
                    <tr><th scope="row">NOMBRE</th><td>' + (feature.properties['NOMBRE'] !== null ? autolinker.link(String(feature.properties['NOMBRE'])) : '') + '</td></tr>\
                    <tr><th scope="row">RIESGO_UNI</th><td>' + (feature.properties['RIESGO_UNI'] !== null ? autolinker.link(String(feature.properties['RIESGO_UNI'])) : '') + '</td></tr>\
                    <tr><th scope="row">ARBOLES</th><td>' + (feature.properties['ARBOLES'] !== null ? autolinker.link(String(feature.properties['ARBOLES'])) : '') + '</td></tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
            layer.on('popupopen', function(e) { addClassToPopupIfMedia(content, e.popup); });
            layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_Parquespriorizados_3_0(feature) {
            switch(String(feature.properties['RIESGO_UNI'])) {
                case 'Muy alto': return { pane: 'pane_Parquespriorizados_3', opacity: 1, color: 'rgba(35,35,35,0.0)', weight: 1.0, fill: true, fillOpacity: 1, fillColor: 'rgba(227,26,28,1.0)', interactive: true };
                case 'Alto': return { pane: 'pane_Parquespriorizados_3', opacity: 1, color: 'rgba(35,35,35,0.0)', weight: 1.0, fill: true, fillOpacity: 1, fillColor: 'rgba(255,127,0,1.0)', interactive: true };
                case 'Medio': return { pane: 'pane_Parquespriorizados_3', opacity: 1, color: 'rgba(35,35,35,0.0)', weight: 1.0, fill: true, fillOpacity: 1, fillColor: 'rgba(239,237,94,1.0)', interactive: true };
                case 'Bajo': return { pane: 'pane_Parquespriorizados_3', opacity: 1, color: 'rgba(35,35,35,0.0)', weight: 1.0, fill: true, fillOpacity: 1, fillColor: 'rgba(178,223,138,1.0)', interactive: true };
                case 'Muy bajo': return { pane: 'pane_Parquespriorizados_3', opacity: 1, color: 'rgba(35,35,35,0.0)', weight: 1.0, fill: true, fillOpacity: 1, fillColor: 'rgba(51,160,44,1.0)', interactive: true };
                default: return { pane: 'pane_Parquespriorizados_3', opacity: 1, color: 'rgba(35,35,35,0.0)', weight: 1.0, fill: true, fillOpacity: 1, fillColor: 'rgba(222,231,92,1.0)', interactive: true };
            }
        }

        map.createPane('pane_Parquespriorizados_3');
        map.getPane('pane_Parquespriorizados_3').style.zIndex = 403;
        var layer_Parquespriorizados_3 = new L.geoJson(json_Parquespriorizados_3, {
            attribution: '',
            interactive: true,
            dataVar: 'json_Parquespriorizados_3',
            layerName: 'layer_Parquespriorizados_3',
            pane: 'pane_Parquespriorizados_3',
            onEachFeature: pop_Parquespriorizados_3,
            style: style_Parquespriorizados_3_0,
        });
        bounds_group.addLayer(layer_Parquespriorizados_3);
        map.addLayer(layer_Parquespriorizados_3);

        // Capa Red Vial
        function pop_Redvialpriorizada_4(feature, layer) {
            var popupContent = '<table>\
                    <tr><th scope="row">CATRIES_UN</th><td>' + (feature.properties['CATRIES_UN'] !== null ? autolinker.link(String(feature.properties['CATRIES_UN'])) : '') + '</td></tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
            layer.on('popupopen', function(e) { addClassToPopupIfMedia(content, e.popup); });
            layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_Redvialpriorizada_4_0(feature) {
            switch(String(feature.properties['CATRIES_UN'])) {
                case 'Muy alto': return { pane: 'pane_Redvialpriorizada_4', opacity: 1, color: 'rgba(35,35,35,0.0)', weight: 1.0, fill: true, fillOpacity: 1, fillColor: 'rgba(227,26,28,1.0)', interactive: true };
                case 'Alto': return { pane: 'pane_Redvialpriorizada_4', opacity: 1, color: 'rgba(35,35,35,0.0)', weight: 1.0, fill: true, fillOpacity: 1, fillColor: 'rgba(255,127,0,1.0)', interactive: true };
                case 'Medio': return { pane: 'pane_Redvialpriorizada_4', opacity: 1, color: 'rgba(35,35,35,0.0)', weight: 1.0, fill: true, fillOpacity: 1, fillColor: 'rgba(239,237,94,1.0)', interactive: true };
                case 'Bajo': return { pane: 'pane_Redvialpriorizada_4', opacity: 1, color: 'rgba(35,35,35,0.0)', weight: 1.0, fill: true, fillOpacity: 1, fillColor: 'rgba(178,223,138,1.0)', interactive: true };
                case 'Muy bajo': return { pane: 'pane_Redvialpriorizada_4', opacity: 1, color: 'rgba(35,35,35,0.0)', weight: 1.0, fill: true, fillOpacity: 1, fillColor: 'rgba(51,160,44,1.0)', interactive: true };
                default: return { pane: 'pane_Redvialpriorizada_4', opacity: 1, color: 'rgba(35,35,35,0.0)', weight: 1.0, fill: true, fillOpacity: 1, fillColor: 'rgba(153,44,236,1.0)', interactive: true };
            }
        }

        map.createPane('pane_Redvialpriorizada_4');
        map.getPane('pane_Redvialpriorizada_4').style.zIndex = 404;
        var layer_Redvialpriorizada_4 = new L.geoJson(json_Redvialpriorizada_4, {
            attribution: '',
            interactive: true,
            dataVar: 'json_Redvialpriorizada_4',
            layerName: 'layer_Redvialpriorizada_4',
            pane: 'pane_Redvialpriorizada_4',
            onEachFeature: pop_Redvialpriorizada_4,
            style: style_Redvialpriorizada_4_0,
        });
        bounds_group.addLayer(layer_Redvialpriorizada_4);
        map.addLayer(layer_Redvialpriorizada_4);

        // Capa Árboles Autorizados Preventiva
        function pop_rbolesautorizadospreventiva_6(feature, layer) {
            var popupContent = '<table>\
                    <tr><th scope="row">COD_SIGAU</th><td>' + (feature.properties['COD_SIGAU'] !== null ? autolinker.link(String(feature.properties['COD_SIGAU'])) : '') + '</td></tr>\
                    <tr><th scope="row">ESPECIE</th><td>' + (feature.properties['ESPECIE'] !== null ? autolinker.link(String(feature.properties['ESPECIE'])) : '') + '</td></tr>\
                    <tr><th scope="row">CAT_EVALUA</th><td>' + (feature.properties['CAT_EVALUA'] !== null ? autolinker.link(String(feature.properties['CAT_EVALUA'])) : '') + '</td></tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
            layer.on('popupopen', function(e) { addClassToPopupIfMedia(content, e.popup); });
            layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_rbolesautorizadospreventiva_6_0() {
            return {
                pane: 'pane_rbolesautorizadospreventiva_6',
                radius: 4.0,
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(255,0,0,1.0)',
                interactive: true,
            }
        }

        map.createPane('pane_rbolesautorizadospreventiva_6');
        map.getPane('pane_rbolesautorizadospreventiva_6').style.zIndex = 406;
        var layer_rbolesautorizadospreventiva_6 = new L.geoJson(json_rbolesautorizadospreventiva_6, {
            attribution: '',
            interactive: true,
            dataVar: 'json_rbolesautorizadospreventiva_6',
            layerName: 'layer_rbolesautorizadospreventiva_6',
            pane: 'pane_rbolesautorizadospreventiva_6',
            onEachFeature: pop_rbolesautorizadospreventiva_6,
            pointToLayer: function (feature, latlng) {
                return L.circleMarker(latlng, style_rbolesautorizadospreventiva_6_0(feature));
            },
        });
        var cluster_rbolesautorizadospreventiva_6 = new L.MarkerClusterGroup({showCoverageOnHover: false, spiderfyDistanceMultiplier: 2});
        cluster_rbolesautorizadospreventiva_6.addLayer(layer_rbolesautorizadospreventiva_6);
        bounds_group.addLayer(layer_rbolesautorizadospreventiva_6);
        cluster_rbolesautorizadospreventiva_6.addTo(map);

        // Capa Límite Urbano
        map.createPane('pane_Lmiteurbano_7');
        map.getPane('pane_Lmiteurbano_7').style.zIndex = 407;
        var layer_Lmiteurbano_7 = new L.geoJson(json_Lmiteurbano_7, {
            attribution: '',
            interactive: false,
            pane: 'pane_Lmiteurbano_7',
            style: { opacity: 1, color: 'rgba(0,0,0,1.0)', weight: 2.0, fillOpacity: 0 }
        });
        bounds_group.addLayer(layer_Lmiteurbano_7);
        map.addLayer(layer_Lmiteurbano_7);

        // Control de Capas y Árbol de Leyenda
        var overlaysTree = [
            {label: '<img src="legend/Lmiteurbano_7.png" /> Límite urbano', layer: layer_Lmiteurbano_7},
            {label: '<img src="legend/rbolesautorizadospreventiva_6.png" /> Árboles autorizados preventiva', layer: cluster_rbolesautorizadospreventiva_6},
            {label: 'Árboles Evaluados preventiva (PMTiles)', layer: capaPMTiles},
            {label: 'Red vial priorizada', layer: layer_Redvialpriorizada_4},
            {label: 'Parques priorizados', layer: layer_Parquespriorizados_3},
            {label: 'Riesgo volcamiento y caída de ramas', layer: layer_Riesgovolcamientoycadaderamas_2},
            {label: "Imagen satelital", layer: layer_Imagensatelital_1, radioGroup: 'bm'},
            {label: "OpenStreetMap", layer: layer_OpenStreetMap_0, radioGroup: 'bm'}
        ];

        var lay = L.control.layers.tree(null, overlaysTree, { collapsed: true });
        lay.addTo(map);

        // Buscador
        map.addControl(new L.Control.Search({
            layer: cluster_rbolesautorizadospreventiva_6,
            initial: false,
            hideMarkerOnCollapse: true,
            propertyName: 'COD_SIGAU'
        }));

        if (document.getElementsByClassName('search-button')[0]) {
            document.getElementsByClassName('search-button')[0].className += ' fa fa-binoculars';
        }
        </script>
    </body>
</html>
