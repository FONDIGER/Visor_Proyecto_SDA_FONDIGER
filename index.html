<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/L.Control.Locate.min.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet-search.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <link rel="stylesheet" href="css/leaflet-measure.css">
        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        /* Estilos explícitos para forzar los círculos amarillo y verde en la leyenda */
        .dot-autorizados {
            height: 11px;
            width: 11px;
            background-color: #ffff00;
            border-radius: 50%;
            display: inline-block;
            border: 1.2px solid #333300;
            vertical-align: middle;
            margin-right: 5px;
        }
        .dot-evaluados {
            height: 11px;
            width: 11px;
            background-color: #33cc33;
            border-radius: 50%;
            display: inline-block;
            border: 1.2px solid #1e7b1e;
            vertical-align: middle;
            margin-right: 5px;
        }
        .legend-square {
            display: inline-block;
            width: 12px;
            height: 12px;
            margin-right: 5px;
            border-radius: 2px;
            vertical-align: middle;
        }
        </style>
        <title>Visor del Proyecto de Gestión del Riesgo del arbolado</title>
    </head>
    <body>

<!-- ENCABEZADO Y LOGO -->
<div id="custom-title" style="
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    background: rgba(255, 255, 255, 0.92);
    padding: 8px 22px;
    border-radius: 20px;
    box-shadow: 0px 2px 8px rgba(0,0,0,0.25);
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
    pointer-events: auto;">
    <h1 style="margin: 0; font-size: 16px; font-weight: bold; color: #1a252f;">
        Visor del Proyecto de Gestión del Riesgo del arbolado. SDA - FONDIGER
    </h1>
</div>

<div id="custom-logo" style="
    position: absolute;
    bottom: 20px;
    left: 15px;
    z-index: 1000;
    background: rgba(255, 255, 255, 0.88);
    padding: 6px 12px;
    border-radius: 8px;
    box-shadow: 0px 2px 6px rgba(0,0,0,0.2);
    display: flex;
    align-items: center;
    pointer-events: auto;">
    <img src="images/logo.PNG" alt="Logo" style="height: 45px; width: auto; display: block;">
</div>

        <div id="map">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/L.Control.Locate.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="js/leaflet-measure.js"></script>
        <script src="js/leaflet-search.js"></script>
        
        <!-- Archivos GeoJSON en formato .js -->
        <script src="data/Riesgovolcamientoycadaderamas_2.js"></script>
        <script src="data/Parquespriorizados_3.js"></script>
        <script src="data/Redvialpriorizada_4.js"></script>
        <script src="data/neatogeo_Capas_optimizadas.js"></script>
        <script src="data/rbolesautorizadospreventiva_6.js"></script>
        <script src="data/Lmiteurbano_7.js"></script>

        <script>
        var map = L.map('map', {
            zoomControl:false, maxZoom:22, minZoom:10
        }).fitBounds([[4.459562594150919,-74.365277374599],[4.83971214808472,-73.87036569117575]]);

        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        
        function removeEmptyRowsFromPopupContent(content, feature) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var rows = tempDiv.querySelectorAll('tr');
            for (var i = 0; i < rows.length; i++) {
                var td = rows[i].querySelector('td.visible-with-data');
                var key = td ? td.id : '';
                if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                    rows[i].parentNode.removeChild(rows[i]);
                }
            }
            return tempDiv.innerHTML;
        }

        var zoomControl = L.control.zoom({ position: 'topleft' }).addTo(map);
        L.control.locate({locateOptions: {maxZoom: 19}}).addTo(map);
        
        var measureControl = new L.Control.Measure({
            position: 'topleft',
            primaryLengthUnit: 'meters',
            secondaryLengthUnit: 'kilometers',
            primaryAreaUnit: 'sqmeters',
            secondaryAreaUnit: 'hectares'
        });
        measureControl.addTo(map);

        // CAPAS BASE
        map.createPane('pane_OpenStreetMap_0');
        map.getPane('pane_OpenStreetMap_0').style.zIndex = 400;
        var layer_OpenStreetMap_0 = L.tileLayer('http://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            pane: 'pane_OpenStreetMap_0', opacity: 1.0, minZoom: 1, maxZoom: 28
        });

        map.createPane('pane_Imagensatelital_1');
        map.getPane('pane_Imagensatelital_1').style.zIndex = 401;
        var layer_Imagensatelital_1 = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            pane: 'pane_Imagensatelital_1', opacity: 1.0, minZoom: 1, maxZoom: 28
        });
        map.addLayer(layer_Imagensatelital_1);

        // RIESGO VOLCAMIENTO
        function style_Riesgovolcamientoycadaderamas_2_0(feature) {
            switch(String(feature.properties['CATRIES_UN'])) {
                case 'Muy alto': return { pane: 'pane_Riesgovolcamientoycadaderamas_2', opacity: 1, color: 'rgba(35,35,35,0)', weight: 1, fill: true, fillOpacity: 0.8, fillColor: 'rgba(227,26,28,1.0)' };
                case 'Alto': return { pane: 'pane_Riesgovolcamientoycadaderamas_2', opacity: 1, color: 'rgba(35,35,35,0)', weight: 1, fill: true, fillOpacity: 0.8, fillColor: 'rgba(255,127,0,1.0)' };
                case 'Medio': return { pane: 'pane_Riesgovolcamientoycadaderamas_2', opacity: 1, color: 'rgba(35,35,35,0)', weight: 1, fill: true, fillOpacity: 0.8, fillColor: 'rgba(239,237,94,1.0)' };
                case 'Bajo': return { pane: 'pane_Riesgovolcamientoycadaderamas_2', opacity: 1, color: 'rgba(35,35,35,0)', weight: 1, fill: true, fillOpacity: 0.8, fillColor: 'rgba(178,223,138,1.0)' };
                case 'Muy bajo': return { pane: 'pane_Riesgovolcamientoycadaderamas_2', opacity: 1, color: 'rgba(35,35,35,0)', weight: 1, fill: true, fillOpacity: 0.8, fillColor: 'rgba(51,160,44,1.0)' };
                default: return { pane: 'pane_Riesgovolcamientoycadaderamas_2', opacity: 1, color: 'rgba(35,35,35,0)', weight: 1, fill: true, fillOpacity: 0.8, fillColor: 'rgba(127,206,23,1.0)' };
            }
        }
        map.createPane('pane_Riesgovolcamientoycadaderamas_2');
        map.getPane('pane_Riesgovolcamientoycadaderamas_2').style.zIndex = 402;
        var layer_Riesgovolcamientoycadaderamas_2 = new L.geoJson(json_Riesgovolcamientoycadaderamas_2, {
            pane: 'pane_Riesgovolcamientoycadaderamas_2', style: style_Riesgovolcamientoycadaderamas_2_0
        });
        map.addLayer(layer_Riesgovolcamientoycadaderamas_2);

        // PARQUES PRIORIZADOS
        function style_Parquespriorizados_3_0(feature) {
            switch(String(feature.properties['RIESGO_UNI'])) {
                case 'Muy alto': return { pane: 'pane_Parquespriorizados_3', opacity: 1, color: 'rgba(35,35,35,0)', weight: 1, fill: true, fillOpacity: 0.8, fillColor: 'rgba(227,26,28,1.0)' };
                case 'Alto': return { pane: 'pane_Parquespriorizados_3', opacity: 1, color: 'rgba(35,35,35,0)', weight: 1, fill: true, fillOpacity: 0.8, fillColor: 'rgba(255,127,0,1.0)' };
                case 'Medio': return { pane: 'pane_Parquespriorizados_3', opacity: 1, color: 'rgba(35,35,35,0)', weight: 1, fill: true, fillOpacity: 0.8, fillColor: 'rgba(239,237,94,1.0)' };
                case 'Bajo': return { pane: 'pane_Parquespriorizados_3', opacity: 1, color: 'rgba(35,35,35,0)', weight: 1, fill: true, fillOpacity: 0.8, fillColor: 'rgba(178,223,138,1.0)' };
                case 'Muy bajo': return { pane: 'pane_Parquespriorizados_3', opacity: 1, color: 'rgba(35,35,35,0)', weight: 1, fill: true, fillOpacity: 0.8, fillColor: 'rgba(51,160,44,1.0)' };
                default: return { pane: 'pane_Parquespriorizados_3', opacity: 1, color: 'rgba(35,35,35,0)', weight: 1, fill: true, fillOpacity: 0.8, fillColor: 'rgba(222,231,92,1.0)' };
            }
        }
        map.createPane('pane_Parquespriorizados_3');
        map.getPane('pane_Parquespriorizados_3').style.zIndex = 403;
        var layer_Parquespriorizados_3 = new L.geoJson(json_Parquespriorizados_3, {
            pane: 'pane_Parquespriorizados_3', style: style_Parquespriorizados_3_0
        });
        map.addLayer(layer_Parquespriorizados_3);

        // RED VIAL PRIORIZADA
        function style_Redvialpriorizada_4_0(feature) {
            switch(String(feature.properties['CATRIES_UN'])) {
                case 'Muy alto': return { pane: 'pane_Redvialpriorizada_4', opacity: 1, color: 'rgba(227,26,28,1.0)', weight: 3 };
                case 'Alto': return { pane: 'pane_Redvialpriorizada_4', opacity: 1, color: 'rgba(255,127,0,1.0)', weight: 3 };
                case 'Medio': return { pane: 'pane_Redvialpriorizada_4', opacity: 1, color: 'rgba(239,237,94,1.0)', weight: 3 };
                case 'Bajo': return { pane: 'pane_Redvialpriorizada_4', opacity: 1, color: 'rgba(178,223,138,1.0)', weight: 3 };
                case 'Muy bajo': return { pane: 'pane_Redvialpriorizada_4', opacity: 1, color: 'rgba(51,160,44,1.0)', weight: 3 };
                default: return { pane: 'pane_Redvialpriorizada_4', opacity: 1, color: 'rgba(153,44,236,1.0)', weight: 3 };
            }
        }
        map.createPane('pane_Redvialpriorizada_4');
        map.getPane('pane_Redvialpriorizada_4').style.zIndex = 404;
        var layer_Redvialpriorizada_4 = new L.geoJson(json_Redvialpriorizada_4, {
            pane: 'pane_Redvialpriorizada_4', style: style_Redvialpriorizada_4_0
        });
        map.addLayer(layer_Redvialpriorizada_4);

        // ÁRBOLES EVALUADOS PREVENTIVA (PUNTOS VERDES)
        map.createPane('pane_neatogeo_Capas_optimizadas_5');
        map.getPane('pane_neatogeo_Capas_optimizadas_5').style.zIndex = 405;
        
        var layer_neatogeo_Capas_optimizadas_5 = new L.geoJson(json_neatogeo_Capas_optimizadas, {
            pane: 'pane_neatogeo_Capas_optimizadas_5',
            pointToLayer: function (feature, latlng) {
                return L.circleMarker(latlng, {
                    radius: 4.0,
                    fillColor: '#33cc33',
                    color: '#1e7b1e',
                    weight: 1,
                    opacity: 1,
                    fillOpacity: 0.95
                });
            }
        });
        map.addLayer(layer_neatogeo_Capas_optimizadas_5);

        // ÁRBOLES AUTORIZADOS PREVENTIVA (PUNTOS AMARILLOS)
        map.createPane('pane_rbolesautorizadospreventiva_6');
        map.getPane('pane_rbolesautorizadospreventiva_6').style.zIndex = 406;
        
        var layer_rbolesautorizadospreventiva_6 = new L.geoJson(json_rbolesautorizadospreventiva_6, {
            pane: 'pane_rbolesautorizadospreventiva_6',
            pointToLayer: function (feature, latlng) {
                return L.circleMarker(latlng, {
                    radius: 4.5,
                    fillColor: '#ffff00',
                    color: '#333300',
                    weight: 1,
                    opacity: 1,
                    fillOpacity: 0.95
                });
            }
        });
        map.addLayer(layer_rbolesautorizadospreventiva_6);

        // LÍMITE URBANO
        map.createPane('pane_Lmiteurbano_7');
        map.getPane('pane_Lmiteurbano_7').style.zIndex = 407;
        var layer_Lmiteurbano_7 = new L.geoJson(json_Lmiteurbano_7, {
            pane: 'pane_Lmiteurbano_7', interactive: false, style: { opacity: 1, color: 'rgba(0,0,0,1.0)', weight: 2.0, fillOpacity: 0 }
        });
        map.addLayer(layer_Lmiteurbano_7);

        // LEYENDA CONTROL DE CAPAS
        var overlaysTree = [
            { label: '<img src="legend/Lmiteurbano_7.png" style="width:12px; height:12px;"/> Límite urbano', layer: layer_Lmiteurbano_7 },
            { label: '<span class="dot-autorizados"></span> <b>Árboles autorizados preventiva</b>', layer: layer_rbolesautorizadospreventiva_6 },
            { label: '<span class="dot-evaluados"></span> <b>Árboles evaluados preventiva</b>', layer: layer_neatogeo_Capas_optimizadas_5 },
            { 
                label: 'Red vial priorizada', 
                layer: layer_Redvialpriorizada_4,
                children: [
                    { label: '<span class="legend-square" style="background:rgba(227,26,28,1.0);"></span> Muy alto' },
                    { label: '<span class="legend-square" style="background:rgba(255,127,0,1.0);"></span> Alto' },
                    { label: '<span class="legend-square" style="background:rgba(239,237,94,1.0);"></span> Medio' },
                    { label: '<span class="legend-square" style="background:rgba(178,223,138,1.0);"></span> Bajo' },
                    { label: '<span class="legend-square" style="background:rgba(51,160,44,1.0);"></span> Muy bajo' }
                ]
            },
            { 
                label: 'Parques priorizados', 
                layer: layer_Parquespriorizados_3,
                children: [
                    { label: '<span class="legend-square" style="background:rgba(227,26,28,1.0);"></span> Muy alto' },
                    { label: '<span class="legend-square" style="background:rgba(255,127,0,1.0);"></span> Alto' },
                    { label: '<span class="legend-square" style="background:rgba(239,237,94,1.0);"></span> Medio' },
                    { label: '<span class="legend-square" style="background:rgba(178,223,138,1.0);"></span> Bajo' },
                    { label: '<span class="legend-square" style="background:rgba(51,160,44,1.0);"></span> Muy bajo' }
                ]
            },
            { 
                label: 'Riesgo volcamiento y caída de ramas', 
                layer: layer_Riesgovolcamientoycadaderamas_2,
                children: [
                    { label: '<span class="legend-square" style="background:rgba(227,26,28,1.0);"></span> Muy alto' },
                    { label: '<span class="legend-square" style="background:rgba(255,127,0,1.0);"></span> Alto' },
                    { label: '<span class="legend-square" style="background:rgba(239,237,94,1.0);"></span> Medio' },
                    { label: '<span class="legend-square" style="background:rgba(178,223,138,1.0);"></span> Bajo' },
                    { label: '<span class="legend-square" style="background:rgba(51,160,44,1.0);"></span> Muy bajo' }
                ]
            },
            { label: "Imagen satelital", layer: layer_Imagensatelital_1, radioGroup: 'bm' },
            { label: "OpenStreetMap", layer: layer_OpenStreetMap_0, radioGroup: 'bm' }
        ];

        var lay = L.control.layers.tree(null, overlaysTree, { collapsed: false });
        lay.addTo(map);

        // BUSCADOR SIGAU
        map.addControl(new L.Control.Search({
            layer: layer_rbolesautorizadospreventiva_6,
            initial: false,
            hideMarkerOnCollapse: true,
            propertyName: 'COD_SIGAU'
        }));

        if (document.getElementsByClassName('search-button')[0]) {
            document.getElementsByClassName('search-button')[0].className += ' fa fa-binoculars';
        }
        </script>
    </body>
</html>
